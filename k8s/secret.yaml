apiVersion: v1
kind: Secret
metadata:
  name: mysql-to-async-secret
type: Opaque
stringData:
  MYSQL_TO_ASYNC_DATASOURCE_USERNAME: "sync_user"
  MYSQL_TO_ASYNC_DATASOURCE_PASSWORD: "sync_password"

  MYSQL_TO_ASYNC_TARGET_USERNAME: "sync_user"
  MYSQL_TO_ASYNC_TARGET_PASSWORD: "sync_password"

  MYSQL_TO_ASYNC_REDIS_PASSWORD: ""

  MYSQL_TO_ASYNC_STORAGE_USERNAME: ""
  MYSQL_TO_ASYNC_STORAGE_PASSWORD: ""

  # 任务密码加密密钥（AES-256-GCM），建议 32 字节；留空则不加密
  MYSQL_TO_ASYNC_SECURITY_ENCRYPT_KEY: ""
