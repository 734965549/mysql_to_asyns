apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-to-sync
  labels:
    app: mysql-to-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-to-sync
  template:
    metadata:
      labels:
        app: mysql-to-sync
    spec:
      containers:
        - name: mysql-to-sync
          image: your-registry/mysql-to-sync:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: mysql-to-sync-config
            - secretRef:
                name: mysql-to-sync-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
